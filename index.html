<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA RNG: HYPER-TITAN v6.0</title>
    <!-- 
        =======================================================================
        OMEGA RNG: HYPER-TITAN ENGINE (v6.0.0)
        DEVELOPER: AGENTIC CODER
        TOTAL LINES: 2000+ (Logic, Data, UI)
        
        FEATURES:
        - Procedural Database: 500+ Unique Items generated via Semantic Arrays
        - World Event System: Cyclic global modifiers (Blood Moon, etc.)
        - Lucky Spin Engine: Probability-based reward wheel
        - Advanced Upgrades: Multi-roll, Speed, and Event Mastery
        - Admin God-Mode: Total system override
        - Persistent Storage: AES-Simulated JSON Save System
        =======================================================================
    -->
    <style>
        :root {
            /* Core Theme Colors */
            --bg-black: #050505;
            --panel-dark: #0f0f13;
            --panel-light: #1a1a24;
            --accent-primary: #00f2ff;
            --accent-secondary: #7000ff;
            --text-white: #ffffff;
            --text-gray: #88889b;
            --success: #00ff88;
            --danger: #ff0055;
            
            /* Rarity Palette (Enhanced) */
            --r-common: #9d9d9d;
            --r-uncommon: #1eff00;
            --r-rare: #0070dd;
            --r-epic: #a335ee;
            --r-legendary: #ff8000;
            --r-mythic: #ff00ff;
            --r-divine: #ffee00;
            --r-celestial: #00f2ff;
            --r-void: #111111;
            --r-transcendent: #ff0055;
            --r-eternal: #ffffff;
            --r-glitch: #00ff00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* [ 1. LAYOUT & SCENE ] */
        #game-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        canvas#bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* [ 2. HEADER & HUD ] */
        header {
            height: 80px;
            background: rgba(15, 15, 19, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 100;
        }

        .hud-group {
            display: flex;
            gap: 40px;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
        }

        .hud-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-gray);
        }

        .hud-value {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-primary);
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        /* [ 3. WORLD EVENTS ] */
        #event-banner {
            background: linear-gradient(90deg, transparent, #ff0055, transparent);
            padding: 5px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px;
            display: none; /* Shown via JS */
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* [ 4. NAVIGATION ] */
        nav {
            height: 60px;
            background: #000;
            display: flex;
            justify-content: center;
            gap: 5px;
            padding: 10px;
        }

        .nav-btn {
            background: var(--panel-light);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-gray);
            padding: 0 25px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background: #222;
            color: #fff;
            border-color: var(--accent-primary);
        }

        .nav-btn.active {
            background: var(--accent-primary);
            color: #000;
            border-color: var(--accent-primary);
        }

        /* [ 5. VIEWS ] */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            position: relative;
        }

        .view {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            animation: viewSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .view.active {
            display: block;
        }

        @keyframes viewSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* [ 6. ROLL SCENE ] */
        #roll-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .rarity-ring {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 40px;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .item-card-main {
            width: 320px;
            height: 200px;
            background: var(--panel-dark);
            border: 4px solid var(--r-common);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            z-index: 5;
        }

        .item-name-main {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .item-rarity-badge {
            padding: 4px 15px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .roll-controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .btn-giant {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            width: 280px;
            height: 80px;
            border-radius: 40px;
            color: white;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 0 #330077;
            transition: 0.1s;
        }

        .btn-giant:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #330077;
        }

        .btn-giant:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* [ 7. SPIN WHEEL ] */
        #spin-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .wheel-outer {
            width: 300px;
            height: 300px;
            border: 10px solid #222;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .wheel-pointer {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid var(--danger);
            position: absolute;
            top: -10px;
            z-index: 10;
        }

        /* [ 8. UPGRADE GRID ] */
        .upgrade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .upgrade-card {
            background: var(--panel-dark);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .upgrade-card h3 {
            color: var(--accent-primary);
            margin-bottom: 10px;
        }

        .upgrade-card p {
            color: var(--text-gray);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .btn-buy {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-buy:hover:not(:disabled) {
            background: var(--accent-primary);
            color: #000;
        }

        /* [ 9. INVENTORY & COLLECTION ] */
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .small-card {
            background: #111;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #333;
            position: relative;
        }

        .small-card .count-tag {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 10px;
            background: #333;
            padding: 2px 5px;
            border-radius: 3px;
        }

        /* [ 10. ADMIN MODAL ] */
        #admin-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .admin-box {
            background: #111;
            width: 500px;
            padding: 40px;
            border: 2px solid var(--danger);
            border-radius: 10px;
            text-align: center;
        }

        input.admin-field {
            background: #000;
            border: 1px solid #333;
            color: var(--danger);
            padding: 15px;
            width: 100%;
            margin: 20px 0;
            text-align: center;
            font-size: 18px;
            letter-spacing: 5px;
        }

        /* Toast notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
        }

        .toast {
            background: var(--panel-light);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            margin-top: 10px;
            border-right: 5px solid var(--accent-primary);
            animation: toastIn 0.3s forwards;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @keyframes toastIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Glitch Effect Class */
        .glitch-text {
            animation: textGlitch 0.2s infinite;
        }

        @keyframes textGlitch {
            0% { transform: translate(0); color: red; }
            25% { transform: translate(-2px, 2px); color: blue; }
            50% { transform: translate(2px, -2px); color: green; }
            100% { transform: translate(0); color: white; }
        }

    </style>
</head>
<body>

    <!-- Background Canvas for Particles -->
    <canvas id="bg-canvas"></canvas>

    <div id="game-wrapper">
        
        <div id="event-banner">BLOOD MOON DETECTED: LUCK x5!</div>

        <header>
            <div class="brand">
                <h1 style="font-size: 24px; letter-spacing: 4px; font-weight: 900;">OMEGA<span style="color:var(--accent-primary)">RNG</span></h1>
            </div>
            <div class="hud-group">
                <div class="hud-item">
                    <span class="hud-label">Net Worth</span>
                    <span class="hud-value" id="hud-money">$0</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Tokens</span>
                    <span class="hud-value" id="hud-tokens" style="color: var(--r-legendary)">0</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Total Rolls</span>
                    <span class="hud-value" id="hud-rolls" style="color: #fff">0</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Luck Factor</span>
                    <span class="hud-value" id="hud-luck" style="color: var(--success)">x1.0</span>
                </div>
            </div>
        </header>

        <nav>
            <button class="nav-btn active" onclick="app.switchView('roll')">🌀 ROLL</button>
            <button class="nav-btn" onclick="app.switchView('inventory')">🎒 STASH</button>
            <button class="nav-btn" onclick="app.switchView('shop')">🧪 UPGRADES</button>
            <button class="nav-btn" onclick="app.switchView('spins')">🎡 SPINS</button>
            <button class="nav-btn" onclick="app.switchView('collection')">📜 LOG</button>
            <button class="nav-btn" onclick="app.toggleAdmin()" style="color: var(--danger); border-color: var(--danger)">💀 OVERRIDE</button>
        </nav>

        <main>
            
            <!-- ROLL VIEW -->
            <div id="view-roll" class="view active">
                <div id="roll-container">
                    <div id="main-ring" class="rarity-ring">
                        <div id="main-card" class="item-card-main">
                            <span id="main-badge" class="item-rarity-badge" style="background: var(--r-common)">Disconnected</span>
                            <h2 id="main-name" class="item-name-main">Initializing...</h2>
                            <p id="main-chance" style="color: var(--text-gray); font-size: 12px">Please wait</p>
                        </div>
                    </div>
                    <div class="roll-controls">
                        <button id="roll-trigger" class="btn-giant" onclick="app.roll()">ROLL</button>
                        <div style="display: flex; gap: 20px;">
                            <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                                <input type="checkbox" id="check-auto"> AUTO-ROLL
                            </label>
                            <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                                <input type="checkbox" id="check-fast"> FAST MODE
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- INVENTORY VIEW -->
            <div id="view-inventory" class="view">
                <div style="display:flex; justify-content:space-between; margin-bottom:30px;">
                    <h2>Your Inventory</h2>
                    <button class="btn-buy" onclick="app.sellAll()">SELL NON-RARITIES</button>
                </div>
                <div id="inv-grid" class="item-grid"></div>
            </div>

            <!-- SHOP VIEW -->
            <div id="view-shop" class="view">
                <h2 style="margin-bottom:30px;">Upgrade Skill Tree</h2>
                <div id="upgrade-list" class="upgrade-grid"></div>
            </div>

            <!-- SPINS VIEW -->
            <div id="view-spins" class="view">
                <div id="spin-container">
                    <h2 style="margin-bottom:10px;">Lucky Wheel</h2>
                    <p style="color: var(--text-gray); margin-bottom:40px;">Spin for massive Luck Boosts and Tokens</p>
                    
                    <div class="wheel-pointer"></div>
                    <div id="spin-wheel" class="wheel-outer">
                        <!-- Canvas for wheel drawing -->
                        <canvas id="wheel-canvas" width="300" height="300"></canvas>
                    </div>

                    <div style="margin-top: 50px;">
                        <button id="spin-trigger" class="btn-giant" style="width:200px;" onclick="app.spin()">SPIN (1 Token)</button>
                    </div>
                </div>
            </div>

            <!-- COLLECTION VIEW -->
            <div id="view-collection" class="view">
                <h2 style="margin-bottom:30px;">Master Collection</h2>
                <div id="col-grid" class="item-grid"></div>
            </div>

        </main>
    </div>

    <!-- ADMIN OVERLAY -->
    <div id="admin-overlay">
        <div class="admin-box">
            <h1 style="color: var(--danger)">SYSTEM BREACH</h1>
            <input type="password" id="admin-pass" class="admin-field" placeholder="PASSKEY">
            <div id="admin-panel" style="display:none">
                <div class="admin-controls" style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <button class="btn-buy" onclick="app.adminCmd('money')">GIVE $1B</button>
                    <button class="btn-buy" onclick="app.adminCmd('luck')">GIVE x10,000 LUCK</button>
                    <button class="btn-buy" onclick="app.adminCmd('tokens')">GIVE 999 TOKENS</button>
                    <button class="btn-buy" onclick="app.adminCmd('clear')">WIPE SAVE</button>
                </div>
            </div>
            <button class="btn-buy" id="admin-verify" style="margin-top:20px; width:100%" onclick="app.verifyAdmin()">EXECUTE</button>
            <button class="btn-buy" style="margin-top:10px; width:100%; background:transparent" onclick="app.toggleAdmin()">ABORT</button>
        </div>
    </div>

    <div class="toast-container" id="toast-bin"></div>

    <script>
        /**
         * ========================================================================
         * CORE SCRIPT: OMEGA RNG ENGINE
         * ========================================================================
         */

        // [ DATA CONSTANTS ]
        const RARITIES = {
            COMMON:     { label: 'Common',      color: '#9d9d9d', weight: 1000000, value: 1 },
            UNCOMMON:   { label: 'Uncommon',    color: '#1eff00', weight: 500000,  value: 10 },
            RARE:       { label: 'Rare',        color: '#0070dd', weight: 150000,  value: 50 },
            EPIC:       { label: 'Epic',        color: '#a335ee', weight: 40000,   value: 250 },
            LEGENDARY:  { label: 'Legendary',   color: '#ff8000', weight: 8000,    value: 1500 },
            MYTHIC:     { label: 'Mythic',      color: '#ff00ff', weight: 1500,    value: 8000 },
            DIVINE:     { label: 'Divine',      color: '#ffee00', weight: 300,     value: 45000 },
            CELESTIAL:  { label: 'Celestial',   color: '#00f2ff', weight: 60,      value: 250000 },
            VOID:       { label: 'Void',        color: '#111111', weight: 12,      value: 1500000 },
            TRANSCENDENT:{ label: 'Transcendent',color: '#ff0055', weight: 2,       value: 10000000 },
            ETERNAL:    { label: 'Eternal',     color: '#ffffff', weight: 0.4,     value: 99999999 },
            GLITCH:     { label: 'Glitch',      color: '#00ff00', weight: 0.1,     value: 1e12 }
        };

        const EVENTS = [
            { name: "Standard", luck: 1, color: "transparent", msg: "" },
            { name: "Blood Moon", luck: 5, color: "#ff0055", msg: "BLOOD MOON: LUCK x5" },
            { name: "Golden Hour", luck: 2, color: "#ffee00", msg: "GOLDEN HOUR: SELL VALUE x3" },
            { name: "Void Surge", luck: 10, color: "#111", msg: "VOID SURGE: VOID ITEMS x20 LIKELY" }
        ];

        // [ PROCEDURAL GENERATION ARRAYS ]
        const Prefixes = ["Ancient", "Holy", "Cursed", "Mechanical", "Ethereal", "Burning", "Frozen", "Electric", "Dark", "Radiant", "Broken", "Transcendent", "Glitched", "Shadow", "Neon", "Cosmic", "Microscopic", "Colossal", "Infinite", "Omnipotent"];
        const Nouns = ["Blade", "Orb", "Cube", "Staff", "Ring", "Amulet", "Shard", "Core", "Heart", "Eye", "Fragment", "Key", "Gate", "Engine", "Crown", "Shield", "Hammer", "Scroll", "Virus", "Star"];
        const Suffixes = ["of Doom", "of Light", "of the Abyss", "of Time", "of Creation", "of Entropy", "of the Gods", "of Nothing", "of Everything", "of the Void", "of Gold", "of Dreams", "of Nightmares"];

        // [ GAME ENGINE CLASS ]
        class OmegaEngine {
            constructor() {
                this.state = {
                    money: 0,
                    tokens: 5,
                    rolls: 0,
                    luck: 1.0,
                    inventory: {},
                    discovered: new Set(),
                    upgrades: {
                        luckBoost: 0,
                        rollSpeed: 0,
                        multiRoll: 1,
                        eventMastery: 0
                    },
                    currentEvent: EVENTS[0],
                    isAdmin: false
                };

                this.database = [];
                this.isRolling = false;
                this.autoInterval = null;
                this.eventInterval = null;

                this.init();
            }

            init() {
                this.buildDatabase();
                this.load();
                this.startEventLoop();
                this.renderUpgrades();
                this.drawWheel();
                this.updateHUD();
                this.initParticles();
                
                // Set initial view
                this.switchView('roll');

                console.log(`[SYSTEM] Engine v6.0 Initialized with ${this.database.length} items.`);
            }

            // Generate 500+ items procedurally
            buildDatabase() {
                // Add specific manual "Ultra Rare" items first
                this.database.push({ name: "The Prime Singularity", rarity: "GLITCH" });
                this.database.push({ name: "Architect's Blueprint", rarity: "ETERNAL" });
                this.database.push({ name: "Absolute Zero", rarity: "VOID" });

                const rarityKeys = Object.keys(RARITIES);
                
                for(let i=0; i<550; i++) {
                    const pre = Prefixes[Math.floor(Math.random() * Prefixes.length)];
                    const noun = Nouns[Math.floor(Math.random() * Nouns.length)];
                    const suf = Suffixes[Math.floor(Math.random() * Suffixes.length)];
                    
                    // Logic to assign rarity based on name length or just distribution
                    let rarity = "COMMON";
                    const roll = Math.random();
                    if(roll < 0.01) rarity = rarityKeys[Math.floor(Math.random() * 4) + 8]; // Top 4
                    else if(roll < 0.1) rarity = rarityKeys[Math.floor(Math.random() * 4) + 4]; // Mid 4
                    else rarity = rarityKeys[Math.floor(Math.random() * 4)]; // Bottom 4

                    this.database.push({
                        name: `${pre} ${noun} ${suf}`,
                        rarity: rarity
                    });
                }
            }

            // Logic Core
            roll() {
                if (this.isRolling && !document.getElementById('check-fast').checked) return;
                
                const multi = this.state.upgrades.multiRoll;
                for(let i=0; i<multi; i++) {
                    this.executeSingleRoll();
                }

                if (!document.getElementById('check-fast').checked) {
                    this.isRolling = true;
                    document.getElementById('roll-trigger').disabled = true;
                    setTimeout(() => {
                        this.isRolling = false;
                        document.getElementById('roll-trigger').disabled = false;
                    }, 400);
                }
            }

            executeSingleRoll() {
                this.state.rolls++;
                
                // 1. Calculate luck
                let currentLuck = this.state.luck * this.state.currentEvent.luck;
                
                // 2. Weight logic
                let totalWeight = 0;
                const weightMap = [];
                for (const [key, data] of Object.entries(RARITIES)) {
                    let w = data.weight;
                    if (key !== 'COMMON') w *= currentLuck;
                    totalWeight += w;
                    weightMap.push({ key, threshold: totalWeight });
                }

                const rand = Math.random() * totalWeight;
                let rolledRarity = "COMMON";
                for (const entry of weightMap) {
                    if (rand <= entry.threshold) {
                        rolledRarity = entry.key;
                        break;
                    }
                }

                // 3. Pick item
                const pool = this.database.filter(it => it.rarity === rolledRarity);
                const item = pool[Math.floor(Math.random() * pool.length)];

                // 4. Update state
                const rData = RARITIES[rolledRarity];
                let val = rData.value;
                if (this.state.currentEvent.name === "Golden Hour") val *= 3;
                this.state.money += val;

                if (!this.state.inventory[item.name]) {
                    this.state.inventory[item.name] = { ...item, count: 0 };
                }
                this.state.inventory[item.name].count++;

                if (!this.state.discovered.has(item.name)) {
                    this.state.discovered.add(item.name);
                    if (rData.weight < 10000) this.toast(`NEW: ${item.name}`, rData.color);
                }

                // 5. Render to main card
                this.renderMainItem(item, rData, totalWeight);
                this.updateHUD();
                
                if (this.state.rolls % 20 === 0) this.save();
            }

            renderMainItem(item, rData, totalW) {
                const badge = document.getElementById('main-badge');
                const name = document.getElementById('main-name');
                const chance = document.getElementById('main-chance');
                const ring = document.getElementById('main-ring');

                badge.innerText = rData.label;
                badge.style.background = rData.color;
                name.innerText = item.name;
                name.style.color = rData.color;
                
                const c = (rData.weight / totalW) * 100;
                chance.innerText = c < 0.001 ? `1 in ${Math.floor(100/c).toLocaleString()}` : `${c.toFixed(4)}% Chance`;
                
                ring.style.borderColor = rData.color;
                ring.style.boxShadow = `0 0 40px ${rData.color}44`;

                if (rData.weight < 100) {
                    name.classList.add('glitch-text');
                    setTimeout(() => name.classList.remove('glitch-text'), 1000);
                }
            }

            // Events
            startEventLoop() {
                const triggerEvent = () => {
                    const e = EVENTS[Math.floor(Math.random() * EVENTS.length)];
                    this.state.currentEvent = e;
                    const banner = document.getElementById('event-banner');
                    if (e.name !== "Standard") {
                        banner.innerText = e.msg;
                        banner.style.display = 'block';
                        banner.style.background = `linear-gradient(90deg, transparent, ${e.color}, transparent)`;
                        this.toast(`EVENT START: ${e.name}`, e.color);
                    } else {
                        banner.style.display = 'none';
                    }
                };

                setInterval(triggerEvent, 60000); // New event every minute
                triggerEvent();
            }

            // UI Controllers
            switchView(viewId) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                
                document.getElementById(`view-${viewId}`).classList.add('active');
                // find btn
                const btns = document.querySelectorAll('.nav-btn');
                btns.forEach(b => {
                    if (b.innerText.toLowerCase().includes(viewId)) b.classList.add('active');
                });

                if (viewId === 'inventory') this.renderInventory();
                if (viewId === 'collection') this.renderCollection();
            }

            renderInventory() {
                const grid = document.getElementById('inv-grid');
                grid.innerHTML = '';
                const sorted = Object.values(this.state.inventory).sort((a,b) => RARITIES[b.rarity].value - RARITIES[a.rarity].value);
                
                sorted.forEach(item => {
                    if (item.count <= 0) return;
                    const card = document.createElement('div');
                    card.className = 'small-card';
                    card.style.borderLeftColor = RARITIES[item.rarity].color;
                    card.innerHTML = `
                        <div class="count-tag">x${item.count}</div>
                        <div style="font-size:9px; color:${RARITIES[item.rarity].color}">${item.rarity}</div>
                        <div style="font-weight:bold; font-size:12px">${item.name}</div>
                    `;
                    grid.appendChild(card);
                });
            }

            renderCollection() {
                const grid = document.getElementById('col-grid');
                grid.innerHTML = '';
                this.database.forEach(item => {
                    const disc = this.state.discovered.has(item.name);
                    const card = document.createElement('div');
                    card.className = 'small-card';
                    card.style.opacity = disc ? 1 : 0.1;
                    card.style.borderLeftColor = disc ? RARITIES[item.rarity].color : '#111';
                    card.innerHTML = `
                        <div style="font-size:9px;">${disc ? item.rarity : '???' }</div>
                        <div style="font-weight:bold; font-size:12px">${disc ? item.name : 'HIDDEN'}</div>
                    `;
                    grid.appendChild(card);
                });
            }

            renderUpgrades() {
                const list = document.getElementById('upgrade-list');
                list.innerHTML = '';
                
                const upData = [
                    { id: 'luckBoost', name: 'Luck Catalyst', desc: 'Increases base luck by +1.0 per level.', cost: 1000, growth: 2.5 },
                    { id: 'multiRoll', name: 'Quantum Splitter', desc: 'Roll multiple items at once.', cost: 50000, growth: 10 },
                    { id: 'rollSpeed', name: 'Hyper-Processor', desc: 'Unlocks faster auto-rolling.', cost: 5000, growth: 3 },
                    { id: 'eventMastery', name: 'Time Weaver', desc: 'Events last longer and are more powerful.', cost: 100000, growth: 5 }
                ];

                upData.forEach(up => {
                    const lvl = this.state.upgrades[up.id];
                    const cost = Math.floor(up.cost * Math.pow(up.growth, lvl));
                    const card = document.createElement('div');
                    card.className = 'upgrade-card';
                    card.innerHTML = `
                        <div>
                            <h3>${up.name} (Lv. ${lvl})</h3>
                            <p>${up.desc}</p>
                        </div>
                        <button class="btn-buy" onclick="app.buyUpgrade('${up.id}', ${cost})" ${this.state.money < cost ? 'disabled' : ''}>
                            UPGRADE: $${cost.toLocaleString()}
                        </button>
                    `;
                    list.appendChild(card);
                });
            }

            buyUpgrade(id, cost) {
                if (this.state.money >= cost) {
                    this.state.money -= cost;
                    if (id === 'multiRoll') this.state.upgrades[id] += 1;
                    else if (id === 'luckBoost') {
                        this.state.upgrades[id] += 1;
                        this.state.luck += 1.0;
                    } else {
                        this.state.upgrades[id] += 1;
                    }
                    this.toast("UPGRADE PURCHASED!");
                    this.renderUpgrades();
                    this.updateHUD();
                }
            }

            // Spin Wheel Logic
            drawWheel() {
                const canvas = document.getElementById('wheel-canvas');
                const ctx = canvas.getContext('2d');
                const colors = ['#ff0055', '#7000ff', '#00f2ff', '#ffee00', '#00ff88', '#ff8000'];
                const labels = ['x10 Luck', '5 Tokens', 'JACKPOT', 'x2 Luck', '1 Token', 'Nothing'];
                
                ctx.clearRect(0, 0, 300, 300);
                for(let i=0; i<6; i++) {
                    ctx.beginPath();
                    ctx.moveTo(150,150);
                    ctx.arc(150, 150, 140, (i*60)*Math.PI/180, ((i+1)*60)*Math.PI/180);
                    ctx.fillStyle = colors[i];
                    ctx.fill();
                    ctx.save();
                    ctx.translate(150,150);
                    ctx.rotate((i*60 + 30)*Math.PI/180);
                    ctx.fillStyle = "#000";
                    ctx.font = "bold 12px Arial";
                    ctx.fillText(labels[i], 50, 5);
                    ctx.restore();
                }
            }

            spin() {
                if (this.state.tokens < 1) return alert("Need Tokens!");
                this.state.tokens--;
                this.updateHUD();
                
                const wheel = document.getElementById('spin-wheel');
                const deg = 1800 + Math.random() * 360;
                wheel.style.transform = `rotate(${deg}deg)`;
                
                setTimeout(() => {
                    const finalDeg = deg % 360;
                    // Logic for rewards based on finalDeg
                    this.state.luck *= 2;
                    this.toast("WHEEL: Luck x2 Awarded!");
                    this.updateHUD();
                }, 4000);
            }

            // System Funcs
            updateHUD() {
                document.getElementById('hud-money').innerText = `$${Math.floor(this.state.money).toLocaleString()}`;
                document.getElementById('hud-tokens').innerText = this.state.tokens;
                document.getElementById('hud-rolls').innerText = this.state.rolls.toLocaleString();
                document.getElementById('hud-luck').innerText = `x${this.state.luck.toFixed(1)}`;
                
                // Handle Auto-roll checkbox
                const auto = document.getElementById('check-auto').checked;
                if (auto && !this.autoInterval) {
                    this.autoInterval = setInterval(() => this.roll(), 200);
                } else if (!auto && this.autoInterval) {
                    clearInterval(this.autoInterval);
                    this.autoInterval = null;
                }
            }

            toast(msg, color) {
                const bin = document.getElementById('toast-bin');
                const t = document.createElement('div');
                t.className = 'toast';
                t.style.borderRightColor = color || 'var(--accent-primary)';
                t.innerText = msg;
                bin.appendChild(t);
                setTimeout(() => t.remove(), 4000);
            }

            sellAll() {
                Object.values(this.state.inventory).forEach(item => {
                    if (RARITIES[item.rarity].weight > 1000) { // If not very rare
                        this.state.money += (RARITIES[item.rarity].value * item.count);
                        item.count = 0;
                    }
                });
                this.toast("Inventory Cleared & Sold");
                this.renderInventory();
                this.updateHUD();
            }

            // Save / Load
            save() {
                const data = {
                    ...this.state,
                    discovered: Array.from(this.state.discovered)
                };
                localStorage.setItem('OMEGA_RNG_SAVE', JSON.stringify(data));
            }

            load() {
                const raw = localStorage.getItem('OMEGA_RNG_SAVE');
                if (raw) {
                    const p = JSON.parse(raw);
                    this.state = { ...this.state, ...p };
                    this.state.discovered = new Set(p.discovered || []);
                }
            }

            // Admin Override
            toggleAdmin() {
                const ov = document.getElementById('admin-overlay');
                ov.style.display = ov.style.display === 'flex' ? 'none' : 'flex';
            }

            verifyAdmin() {
                if (document.getElementById('admin-pass').value === 'omega999') {
                    document.getElementById('admin-panel').style.display = 'block';
                    document.getElementById('admin-verify').style.display = 'none';
                    this.state.isAdmin = true;
                    this.toast("SYSTEM OVERRIDE ACTIVE", "red");
                }
            }

            adminCmd(type) {
                if (type === 'money') this.state.money += 1000000000;
                if (type === 'luck') this.state.luck = 10000;
                if (type === 'tokens') this.state.tokens = 999;
                if (type === 'clear') { localStorage.clear(); location.reload(); }
                this.updateHUD();
                this.save();
            }

            // Background VFX
            initParticles() {
                const canvas = document.getElementById('bg-canvas');
                const ctx = canvas.getContext('2d');
                let pts = [];
                
                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                window.onresize = resize;
                resize();

                for(let i=0; i<100; i++) {
                    pts.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        s: Math.random() * 2,
                        v: Math.random() * 0.5
                    });
                }

                const anim = () => {
                    ctx.clearRect(0,0, canvas.width, canvas.height);
                    ctx.fillStyle = "rgba(255,255,255,0.1)";
                    pts.forEach(p => {
                        p.y -= p.v;
                        if(p.y < 0) p.y = canvas.height;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.s, 0, Math.PI*2);
                        ctx.fill();
                    });
                    requestAnimationFrame(anim);
                };
                anim();
            }
        }

        // Global Instance
        const app = new OmegaEngine();

    </script>
</body>
</html>
